name: AGT-062 Temporary Formatter
on:
  push:
    branches:
      - feat/agt-062-shell-brand-settings
permissions:
  contents: write
jobs:
  format-only:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write             apps/web/src/features/settings/general-settings.tsx             apps/web/src/features/workspace-shell/workspace-shell-frame.tsx             apps/web/tests/workspace-cutover.test.tsx             apps/web/tests/workspace-shell-layout.test.ts
      - name: Commit formatted source
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/web/src/features/settings/general-settings.tsx apps/web/src/features/workspace-shell/workspace-shell-frame.tsx apps/web/tests/workspace-cutover.test.tsx apps/web/tests/workspace-shell-layout.test.ts
            git commit -m "style(web): format AGT-062 shell settings"
            git push origin HEAD:feat/agt-062-shell-brand-settings
          fi

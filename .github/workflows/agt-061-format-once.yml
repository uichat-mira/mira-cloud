name: AGT-061 Temporary Formatter
on:
  push:
    branches:
      - feat/agt-061-workspace-tabs
permissions:
  contents: write
jobs:
  format-only:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write             apps/web/src/components/mira-design/WorkspaceTabs.tsx             apps/web/src/components/mira-design/index.ts
      - name: Commit formatted source
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/web/src/components/mira-design/WorkspaceTabs.tsx apps/web/src/components/mira-design/index.ts
            git commit -m "style(web): format AGT-061 WorkspaceTabs"
            git push origin HEAD:feat/agt-061-workspace-tabs
          fi

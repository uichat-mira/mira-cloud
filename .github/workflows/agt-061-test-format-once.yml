name: AGT-061 Test Formatter
on:
  push:
    branches:
      - feat/agt-061-workspace-tabs
permissions:
  contents: write
jobs:
  format-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/tests/mira-design/workspace-tabs.test.tsx
      - name: Commit formatted test
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/web/tests/mira-design/workspace-tabs.test.tsx
            git commit -m "style(web): format AGT-061 WorkspaceTabs tests"
            git push origin HEAD:feat/agt-061-workspace-tabs
          fi

name: AGT-065 Temporary Formatter
on:
  push:
    branches:
      - feat/agt-065-mobile-left-nav
permissions:
  contents: write
jobs:
  format-only:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write             apps/web/src/components/mira-design/CollapsiblePanel.tsx             apps/web/src/components/mira-design/Drawer.tsx             apps/web/src/features/work/workspace-view.tsx             apps/web/src/features/workspace-shell/types.ts             apps/web/src/features/workspace-shell/workspace-shell-frame.tsx             apps/web/src/features/workspace-shell/workspace-shell.css             apps/web/tests/mira-design/interaction-components.test.tsx             apps/web/tests/workspace-cutover.test.tsx
      - name: Commit formatted source
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/web/src/components/mira-design/CollapsiblePanel.tsx apps/web/src/components/mira-design/Drawer.tsx apps/web/src/features/work/workspace-view.tsx apps/web/src/features/workspace-shell/types.ts apps/web/src/features/workspace-shell/workspace-shell-frame.tsx apps/web/src/features/workspace-shell/workspace-shell.css apps/web/tests/mira-design/interaction-components.test.tsx apps/web/tests/workspace-cutover.test.tsx
            git commit -m "style(web): format AGT-065 mobile navigation"
            git push origin HEAD:feat/agt-065-mobile-left-nav
          fi

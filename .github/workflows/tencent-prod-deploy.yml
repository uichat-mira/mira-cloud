name: Deploy Mira Cloud to Tencent VPS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mira-cloud-tencent-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Package exact prod commit, deploy and smoke Tencent
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      TX_DEPLOY_HOST: ${{ secrets.TX_DEPLOY_HOST }}
      TX_DEPLOY_USER: ${{ secrets.TX_DEPLOY_USER }}
      SSHPASS: ${{ secrets.TX_DEPLOY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install and verify exact prod source
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm check
      - name: Build release Web and Linux amd64 API image
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm --filter @mira-cloud/web build
          docker build --pull --platform linux/amd64 \
            -f apps/api/Dockerfile -t "mira-cloud-api:$GITHUB_SHA" .
          docker image inspect "mira-cloud-api:$GITHUB_SHA" --format '{{.Id}}' >/dev/null
      - name: Prepare integrity-checked release bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p release
          tar -czf release/web.tar.gz -C apps/web/dist .
          docker save "mira-cloud-api:$GITHUB_SHA" | gzip -1 > release/api-image.tar.gz
          cp deploy/mira-cloud/compose.yaml release/compose.yaml
          cp deploy/mira-cloud/cloud.tomzlab.cn.caddy release/cloud.tomzlab.cn.caddy
          cp scripts/mira-cloud-activate-on-host.sh release/activate.sh
          (cd release && sha256sum web.tar.gz api-image.tar.gz compose.yaml \
            cloud.tomzlab.cn.caddy activate.sh > checksums.sha256)
          (cd release && sha256sum -c checksums.sha256)
          tar -tzf release/web.tar.gz >/dev/null
      - name: Strict pinned Tencent SSH, deploy with rollback and local API/DB smoke
        shell: bash
        run: bash scripts/mira-cloud-tencent-ship.sh
      - name: Public HTTPS T5 smoke when A record is ready
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! getent ahostsv4 cloud.tomzlab.cn | awk '{print $1}' | grep -Fxq "$TX_DEPLOY_HOST"; then
            echo '::warning::PUBLIC_T5_PENDING_DNS: cloud.tomzlab.cn A record not yet direct to Tencent VPS'
            exit 0
          fi
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 12 https://cloud.tomzlab.cn/ | grep -Fq 'Mira Cloud' &&
               curl -fsS --max-time 12 https://cloud.tomzlab.cn/api/v1/ready | grep -Fq '"status":"ready"'; then
              echo 'TX_PUBLIC_HTTPS_WEB_AND_API_T5=PASS'
              exit 0
            fi
            sleep 10
          done
          echo '::error::Public domain resolves to Tencent but HTTPS Web/API smoke failed'
          exit 1

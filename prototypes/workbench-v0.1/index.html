function runDetail(){const r=data.runs.find(x=>x.id===currentDetail);if(!r){page='runs';currentDetail=null;return runsPage()}const art=data.artifacts.find(x=>x.id===r.artifactId);const steps=[['1','接受委托','来源：'+r.kind],['2','启动执行','创建并记录独立 Run ID'],['3',r.status==='failed'?'执行失败':r.status==='running'?'执行中':'记录执行结果',r.status==='failed'?'失败信息已记录':r.status==='running'?'正在进行演示执行':'已保存终态及运行摘要'],['4',r.status==='running'?'等待成果':'产物归档',r.status==='running'?'稍后可查看成果':art?'成果可点击打开':'该执行没有生成产物']];return '<div class="detail-page"><div class="page-head"><div><div class="eyebrow">RUN DETAIL / '+esc(r.id)+'</div><h1>'+esc(r.title)+'</h1><p>'+esc(r.kind)+' · '+when(r.started)+'</p></div><div class="head-actions"><button class="btn" data-action="back-runs">返回记录</button>'+status(r.status)+'</div></div><div class="detail-layout"><div class="stack">'+panel('执行过程','追踪每一步发生了什么',steps.map((x,i)=>'<div class="stage '+((r.status==='running'&&i>1)?'pending':'')+'"><span class="stage-icon">'+((r.status==='running'&&i>1)?'·':i+1)+'</span><div><strong>'+esc(x[1])+'</strong><p>'+esc(x[2])+'</p></div></div>').join(''))+panel('执行摘要','保留状态与证据，而非空泛的成功提示','<p class="report">'+esc(r.report||'本次执行尚在进行，摘要将在结束后写入。')+'</p>'+(art?'<button class="btn btn-primary" data-action="detail-artifact" data-id="'+esc(art.id)+'" style="margin-top:14px">'+icon('files')+' 打开关联成果</button>':''))+'</div><div class="stack">'+panel('运行属性','','<div class="detail-list"><div class="line"><span>Run ID</span><strong>'+esc(r.id)+'</strong></div><div class="line"><span>触发来源</span><strong>'+esc(r.kind)+'</strong></div><div class="line"><span>状态</span><strong>'+esc({running:'执行中',completed:'已完成',partial:'部分完成',failed:'失败'}[r.status]||r.status)+'</strong></div><div class="line"><span>开始时间</span><strong>'+when(r.started)+'</strong></div><div class="line"><span>结束时间</span><strong>'+when(r.finished)+'</strong></div><div class="line"><span>费用</span><strong>'+esc(r.cost||'—')+'</strong></div><div class="line"><span>工具范围</span><strong>'+esc(r.scope)+'</strong></div></div>')+panel('执行策略','','<div class="inline-notice">所有操作均为本地模拟。生产版需由 Cloud Auth 验证委托身份，并由 Cloud Pi 校验工具权限、执行预算与外部副作用。</div>')+'</div></div></div>'}
function artifactDetail(){const a=data.artifacts.find(x=>x.id===currentDetail);if(!a){page='artifacts';currentDetail=null;return artifactsPage()}return '<div class="detail-page"><div class="page-head"><div><div class="eyebrow">ARTIFACT / '+esc(a.id)+'</div><h1>'+esc(a.title)+'</h1><p>由运行 '+esc(a.runId)+' 生成 · '+when(a.created)+'</p></div><div class="head-actions"><button class="btn" data-action="back-artifacts">返回成果库</button></div></div><div class="detail-layout"><div class="stack">'+panel('Markdown 成果','可阅读、复制、下载、作为下一次委托的输入','<div class="report">'+esc(a.content)+'</div>')+'</div><div class="stack">'+panel('成果操作','','<div style="display:flex;flex-wrap:wrap;gap:8px"><button class="btn" data-action="copy-artifact" data-id="'+esc(a.id)+'">'+icon('copy')+'复制</button><button class="btn" data-action="download-artifact" data-id="'+esc(a.id)+'">'+icon('download')+'下载 .md</button><button class="btn btn-primary" data-action="reuse-artifact" data-id="'+esc(a.id)+'">'+icon('refresh')+'基于它继续</button></div><div class="inline-notice">“基于它继续”会预填一个新委托，但不会修改原成果。</div>')+panel('出处信息','','<div class="detail-list"><div class="line"><span>Artifact ID</span><strong>'+esc(a.id)+'</strong></div><div class="line"><span>来源 Run</span><strong>'+esc(a.runId)+'</strong></div><div class="line"><span>类型</span><strong>'+(a.type==='note'?'工作笔记':'研究报告')+'</strong></div><div class="line"><span>生成时间</span><strong>'+when(a.created)+'</strong></div></div><button class="btn btn-sm" style="margin-top:12px" data-action="detail-run" data-id="'+esc(a.runId)+'">查看来源运行 '+icon('chevron',12)+'</button>')+'</div></div></div>'}
function render(){const view=currentDetail?(page==='run-detail'?runDetail():page==='artifact-detail'?artifactDetail():''):null;const inner=view||({overview, tasks:taskPage,schedules:schedulePage,runs:runsPage,artifacts:artifactsPage,about:aboutPage}[page]||overview)();document.getElementById('app').innerHTML='<div class="app">'+header()+'<div class="workspace">'+topHeader()+'<main class="content">'+inner+'<p class="footer-note">Mira Cloud · 统一工作台交互概念原型 · 所有任务、费用、状态与成果均为演示数据，不连接生产。</p></main></div></div>'+mobileNav();renderModal()}
function dialog(title,desc,body,btn){return '<div class="overlay" id="modal-backdrop"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="dialog-head"><div><h2 id="dialog-title">'+title+'</h2><p>'+desc+'</p></div><button class="dialog-close" data-action="close-modal" aria-label="关闭">'+icon('x',17)+'</button></div><form id="action-form">'+body+'<div class="dialog-foot"><button type="button" class="btn" data-action="close-modal">取消</button><button class="btn btn-primary" type="submit">'+icon('check',15)+btn+'</button></div></form></div></div>'}
function renderModal(){let s='';if(modal?.type==='task'){s=dialog(modal?.reuse?'基于成果继续工作':'新建临时委托','创建一次有独立运行 ID 的即时工作。','<div class="field"><label for="f-title">委托名称 *</label><input id="f-title" name="title" maxlength="70" required placeholder="例如：研究近期 Agent 框架变化" value="'+esc(modal.title||'')+'" /></div><div class="field"><label for="f-prompt">工作目标与要求 *</label><textarea id="f-prompt" name="prompt" maxlength="3500" required placeholder="希望 Mira 完成什么？成果应该是什么形式？">'+esc(modal.prompt||'')+'</textarea></div><div class="field-grid"><div class="field"><label for="f-scope">能力范围</label><select id="f-scope" name="scope"><option>公开研究</option><option>仅总结输入</option></select></div><div class="field"><label for="f-result">成果形式</label><select id="f-result" name="output"><option>研究报告</option><option>工作笔记</option></select></div></div><div class="inline-notice">这是一段演示流程：创建后会模拟 3 秒执行并生成一份示例成果，不调用真实模型或 MCP。</div>','创建并模拟执行')}
else if(modal?.type==='schedule'){const a=modal.id?data.schedules.find(x=>x.id===modal.id):null;s=dialog(a?'编辑定时计划':'创建定时计划','计划本身不执行工作，而是决定何时创建新的 Run。','<div class="field"><label for="f-title">计划名称 *</label><input id="f-title" name="title" maxlength="70" required placeholder="例如：每日研发简报" value="'+esc(a?.title||'')+'" /></div><div class="field"><label for="f-prompt">任务目标 *</label><textarea id="f-prompt" name="prompt" maxlength="3500" required placeholder="每次运行具体需要做什么？">'+esc(a?.prompt||'')+'</textarea></div><div class="field-grid"><div class="field"><label for="f-frequency">触发周期</label><select id="f-frequency" name="frequency"><option value="daily" '+(a?.frequency==='daily'?'selected':'')+'>每天</option><option value="weekly" '+(a?.frequency==='weekly'?'selected':'')+'>每周</option></select></div><div class="field"><label for="f-time">执行时间</label><input id="f-time" name="time" type="time" required value="'+esc(a?.time||'08:00')+'" /></div></div><div class="field-grid"><div class="field"><label for="f-timezone">时区</label><select id="f-timezone" name="timezone"><option value="Asia/Shanghai" '+(a?.timezone==='Asia/Shanghai'?'selected':'')+'>北京时间 Asia/Shanghai</option><option value="Europe/London" '+(a?.timezone==='Europe/London'?'selected':'')+'>英国 Europe/London</option><option value="UTC" '+(a?.timezone==='UTC'?'selected':'')+'>UTC</option></select></div><div class="field"><label for="f-delivery">交付位置</label><select id="f-delivery" name="delivery"><option>仅工作台</option><option disabled>飞书 · 待连接</option><option disabled>企业微信 · 待连接</option></select></div></div><div class="inline-notice">演示版可创建、暂停和模拟立即执行。真实的时区计算、调度和投递由 Cloud Pi 服务端负责。</div>','保存计划')}
else if(modal?.type==='confirm-reset'){s=dialog('重置演示数据','这只会重置当前浏览器中的原型数据。','<p style="font-size:12px">已模拟创建的任务、计划、运行记录和成果将恢复到初始演示状态。不会影响任何真实 Mira 服务。</p>','确认重置')}
else if(modal?.type==='confirm-run'){const a=data.schedules.find(x=>x.id===modal.id);s=dialog('模拟立即执行','此操作只在原型中创建一次 Run。','<p style="font-size:12px">计划：<b>'+esc(a?.title||'')+'</b></p><div class="inline-notice">正式产品必须二次确认真实模型费用及可能的外部投递；此处不会产生任何真实费用或发送。</div>','开始模拟')}
document.getElementById('modal-root').innerHTML=s;if(s){const f=document.querySelector('#modal-root input');f?.focus()}}
function notify(message){clearTimeout(toastTimer);const root=document.getElementById('toast-root');root.innerHTML='<div class="toast">'+icon('check',17)+esc(message)+'</div>';toastTimer=setTimeout(()=>root.innerHTML='',3600)}
function setPage(p){page=p;filter='all';search='';currentDetail=null;render();window.scrollTo({top:0,behavior:'instant'})}
function startMockRun(title,kind,taskId,scheduleId,scope,output){const rid=id('run'),now=new Date().toISOString();const r={id:rid,title,kind,status:'running',started:now,finished:null,scope,cost:'演示，不计费',report:'',artifactId:null,taskId,scheduleId,output:output||'研究报告'};data.runs.unshift(r);if(taskId){const t=data.tasks.find(t=>t.id===taskId);if(t){t.runId=rid;t.status='running'}}save();return r}
function finishMockRun(rid){const r=data.runs.find(x=>x.id===rid);if(!r||r.status!=='running')return;r.status='completed';r.finished=new Date().toISOString();const a={id:id('art'),title:r.title+' · 执行摘要',type:r.output==='工作笔记'?'note':'report',description:'根据演示任务生成的模拟成果，可查看、下载并复用。',created:r.finished,runId:rid,content:'# '+r.title+'\n\n> Mira Cloud 工作台演示生成。本结果不代表真实模型执行。\n\n## 委托结果\n\n本次演示已完成任务状态流转，产生了唯一 Run ID、运行记录及可复用 Artifact。\n\n## 接下来\n\n在正式产品中，这里将替换为通过实际工具与模型生成、带来源证据的内容。'};r.artifactId=a.id;r.report='模拟执行完成，成果已经保存至成果库。';data.artifacts.unshift(a);if(r.taskId){const t=data.tasks.find(x=>x.id===r.taskId);if(t)t.status='completed'}if(r.scheduleId){const s=data.schedules.find(x=>x.id===r.scheduleId);if(s)s.lastRun=r.finished}save();render();notify('模拟执行已完成，成果已经归档')}
function runSchedule(idValue){const s=data.schedules.find(x=>x.id===idValue);if(!s)return;const run=startMockRun(s.title,'定时计划',null,s.id,s.scope,'研究报告');modal=null;setPage('runs');notify('已创建模拟运行 '+run.id);setTimeout(()=>finishMockRun(run.id),2800)}
function handleAction(action,element){const xid=element?.dataset?.id;if(action==='new-task'){modal={type:'task'};renderModal()}else if(action==='new-schedule'){modal={type:'schedule'};renderModal()}else if(action==='edit-schedule'){modal={type:'schedule',id:xid};renderModal()}else if(action==='close-modal'){modal=null;renderModal()}else if(action==='detail-run'){currentDetail=xid;page='run-detail';render();window.scrollTo(0,0)}else if(action==='detail-artifact'){currentDetail=xid;page='artifact-detail';render();window.scrollTo(0,0)}else if(action==='back-runs'){setPage('runs')}else if(action==='back-artifacts'){setPage('artifacts')}else if(action==='reset'){modal={type:'confirm-reset'};renderModal()}else if(action==='run-schedule'){modal={type:'confirm-run',id:xid};renderModal()}else if(action==='toggle-schedule'){const s=data.schedules.find(x=>x.id===xid);if(!s)return;s.status=s.status==='active'?'paused':'active';s.nextRun=s.status==='active'?ago(1,Number(s.time.split(':')[0])):null;save();render();notify(s.status==='active'?'计划已恢复（演示）':'计划已暂停（演示）')}else if(action==='copy-artifact'){const a=data.artifacts.find(x=>x.id===xid);if(a)copyText(a.content)}else if(action==='download-artifact'){const a=data.artifacts.find(x=>x.id===xid);if(a){const u=URL.createObjectURL(new Blob([a.content],{type:'text/markdown;charset=utf-8'}));const link=document.createElement('a');link.href=u;link.download='mira-artifact-'+a.id+'.md';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);notify('已下载演示 Markdown 文件')}}else if(action==='reuse-artifact'){const a=data.artifacts.find(x=>x.id===xid);if(a){modal={type:'task',reuse:true,title:'继续研究：'+a.title,prompt:'请参考上一份成果（Artifact '+a.id+'）继续深入分析。\n\n'+short(a.content,900)};renderModal()}}}
async function copyText(s){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(s);else{const e=document.createElement('textarea');e.value=s;document.body.append(e);e.select();document.execCommand('copy');e.remove()}notify('成果内容已复制')}catch{notify('复制失败，请手动选取文本')}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-page],[data-action]');if(el){e.preventDefault();if(el.dataset.page)setPage(el.dataset.page);else handleAction(el.dataset.action,el)}else if(e.target?.id==='modal-backdrop'){modal=null;renderModal()}});
document.addEventListener('input',e=>{if(e.target?.id==='list-search'){const input=e.target;search=input.value;const start=input.selectionStart;render();const next=document.getElementById('list-search');next?.focus();if(next?.setSelectionRange)next.setSelectionRange(start,start)}});
document.addEventListener('change',e=>{if(e.target?.id==='list-filter'){filter=e.target.value;render()}});
document.addEventListener('submit',e=>{if(e.target.id!=='action-form')return;e.preventDefault();const type=modal?.type;if(type==='confirm-reset'){data=seed();save();modal=null;setPage('overview');notify('演示数据已重置');return}if(type==='confirm-run'){const scheduleId=modal.id;runSchedule(scheduleId);return}const form=e.target;const fd=new FormData(form);const title=String(fd.get('title')||'').trim(),prompt=String(fd.get('prompt')||'').trim();if(!title||!prompt)return;if(type==='task'){const tid=id('task');const now=new Date().toISOString();data.tasks.unshift({id:tid,title,prompt,created:now,status:'running',scope:String(fd.get('scope')||'公开研究'),origin:'临时委托',runId:null});const run=startMockRun(title,'临时委托',tid,null,String(fd.get('scope')||'公开研究'),String(fd.get('output')||'研究报告'));modal=null;setPage('runs');notify('委托已创建，正在模拟执行');setTimeout(()=>finishMockRun(run.id),2800)}else if(type==='schedule'){const old=modal.id?data.schedules.find(x=>x.id===modal.id):null;const time=String(fd.get('time')||'08:00'),hour=Number(time.split(':')[0]);const obj={id:old?.id||id('sch'),title,prompt,frequency:String(fd.get('frequency')||'daily'),time,timezone:String(fd.get('timezone')||'Asia/Shanghai'),delivery:String(fd.get('delivery')||'仅工作台'),status:old?.status||'active',scope:'公开研究',nextRun:old?.status==='paused'?null:ago(1,hour),lastRun:old?.lastRun||null};if(old)Object.assign(old,obj);else data.schedules.unshift(obj);save();modal=null;setPage('schedules');notify(old?'计划已更新（演示）':'定时计划已创建（演示）')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=null;renderModal()}});
render();
})();
</script>
</body></html>

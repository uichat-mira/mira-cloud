<!doctype html>
<html lang="zh-CN" data-mira-color-theme="warm-neutral" data-mira-theme-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f8f8f6" />
    <title>Mira Cloud · 工作台</title>
    <script>
      (() => {
        const presets = ["warm-neutral", "knowledge-blue", "archive-green", "slate-ocean"];
        try {
          const saved = JSON.parse(localStorage.getItem("mira-cloud-theme-v1") || "null");
          if (
            saved &&
            presets.includes(saved.preset) &&
            ["light", "dark"].includes(saved.appearance)
          ) {
            document.documentElement.dataset.miraColorTheme = saved.preset;
            document.documentElement.dataset.miraThemeMode = saved.appearance;
            document.documentElement.classList.toggle("dark", saved.appearance === "dark");
          } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            document.documentElement.dataset.miraThemeMode = "dark";
            document.documentElement.classList.add("dark");
          }
        } catch {
          // Invalid optional appearance preference must not block first paint.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
